name: CI/CD — Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    # run this job on a self-hosted runner you register with labels 'self-hosted' and 'local-deploy'
    runs-on: [self-hosted, local-deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend (optional local build)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy locally on self-hosted runner
        # ensure this step runs with a bash-compatible shell on your runner
        shell: bash
        run: |
          set -e
          # If your repo is checked out to a particular path on the runner, cd there
          # (Actions runner already runs in the workspace root)

          # Install backend production deps
          echo "Installing backend dependencies"
          npm ci --production

          # Build frontend (if present)
          echo "Building frontend (if present)"
          if [ -d frontend ]; then
            cd frontend
            npm ci
            npm run build
            cd ..
          fi

          # Restart with PM2
          echo "Restarting app with PM2"
          export NODE_ENV=production
          pm2 describe tanmia || pm2 start server.js --name tanmia --update-env
          pm2 reload tanmia || true
          pm2 save
