name: CI/CD — Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    # run this job on a self-hosted runner you register with labels 'self-hosted' and 'local-deploy'
    runs-on: [self-hosted, local-deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy locally on self-hosted runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Install backend dependencies
          Write-Host "Installing backend dependencies"
          cd backend
          npm ci --production
          cd ..

          # Build frontend
          Write-Host "Building frontend"
          cd frontend
          npm ci
          npm run build
          cd ..

          # Restart with PM2
          Write-Host "Restarting app with PM2"
          $env:NODE_ENV = "production"
          cd backend
          try { pm2 describe tanmia } catch { pm2 start server.js --name tanmia --update-env }
          try { pm2 reload tanmia } catch { }
          pm2 save
            echo "Ensure frontend dist exists"
            if [ -d frontend/dist ]; then
              echo "frontend/dist present"
            else
              echo "frontend/dist missing; creating directory"
              mkdir -p frontend/dist
            fi
            echo "Restarting app with PM2"
            export NODE_ENV=production
            pm2 describe tanmia || pm2 start server.js --name tanmia --update-env
            pm2 reload tanmia || true
            pm2 save
