name: CI/CD — Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    # run this job on a self-hosted runner you register with labels 'self-hosted' and 'local-deploy'
    runs-on: [self-hosted, local-deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy locally on self-hosted runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Install backend dependencies
          Write-Host "Installing backend dependencies"
          cd backend
          npm ci --production
          cd ..

          # Build frontend
          Write-Host "Building frontend"
          cd frontend
          npm ci
          npm run build
          cd ..

          # Ensure frontend dist exists
          Write-Host "Ensure frontend dist exists"
          if (Test-Path frontend/dist) {
            Write-Host "frontend/dist present"
          } else {
            Write-Host "frontend/dist missing; creating directory"
            New-Item -ItemType Directory -Force -Path frontend/dist
          }

          # Restart with PM2
          Write-Host "Restarting app with PM2"
          $env:NODE_ENV = "production"
          cd backend
          pm2 describe tanmia 2>$null
          if ($LASTEXITCODE -ne 0) { pm2 start server.js --name tanmia --update-env }
          pm2 reload tanmia 2>$null
          pm2 save
