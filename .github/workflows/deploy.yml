name: CI/CD — Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend (optional local build)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # passphrase: ${{ secrets.SSH_PASSPHRASE }} # optional
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}
            echo "Pulling latest from origin/main"
            git fetch --all
            git reset --hard origin/main
            echo "Installing backend dependencies"
            npm ci --production
            echo "Building frontend on server (if present)"
            if [ -d frontend ]; then
              cd frontend
              npm ci
              npm run build
              cd ..
            fi
            echo "Restarting app with PM2"
            export NODE_ENV=production
            pm2 describe tanmia || pm2 start server.js --name tanmia --update-env
            pm2 reload tanmia || true
            pm2 save
